<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Exclusive - Las Vegas Championship Prediction</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: #030406;
            color: #f1f2f6;
            padding: 18px 10px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            align-items: flex-start;
        }

        .prediction-card {
            width: min(100%, 860px);
            background: linear-gradient(145deg, #12141b, #0a0b10);
            border-radius: 24px;
            padding: 18px 14px 24px;
            border: 1px solid rgba(255, 183, 43, 0.27);
            box-shadow: 0 0 40px rgba(255, 136, 0, 0.15);
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .vip-tag {
            background: linear-gradient(90deg, #ff6700, #ffbc2c);
            color: #000;
            font-weight: bold;
            padding: 7px 18px;
            border-radius: 30px;
            font-size: 12px;
            letter-spacing: 1px;
        }

        .lang-select {
            background: #222328;
            border: 1px solid rgba(255, 193, 56, 0.44);
            color: #fff;
            padding: 7px 12px;
            border-radius: 12px;
            font-size: 12px;
        }

        .title-area {
            text-align: center;
            margin-bottom: 22px;
        }

        .sub-head {
            color: #ffd370;
            letter-spacing: 2px;
            font-size: 13px;
            margin-bottom: 8px;
        }

        h1 {
            font-size: clamp(28px, 5.5vw, 42px);
            background: linear-gradient(180deg, #ffdd78, #b88c20);
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }

        .event-date {
            display: inline-block;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 215, 0, 0.35);
            border-radius: 20px;
            padding: 8px 16px;
            color: #ffd700;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .desc-text {
            color: #b4b8c3;
            margin-top: 6px;
            font-size: 13px;
            line-height: 1.45;
        }

        /* 对战人物区域 */
        .fight-banner {
            position: relative;
            height: clamp(240px, 52vw, 320px);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            margin-bottom: 24px;
        }

        .side-left,
        .side-right {
            flex: 1;
            position: relative;
            transition: all 0.45s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 18px;
        }

        .side-left {
            background: linear-gradient(90deg, #702c10, #3b1c0e);
        }

        .side-right {
            background: linear-gradient(-90deg, #423b18, #272410);
        }

        .fight-banner.not-select .side-left,
        .fight-banner.not-select .side-right {
            filter: brightness(0.68);
        }

        .fight-banner.select-left .side-left {
            filter: brightness(1.18);
            box-shadow: inset 0 0 70px rgba(255, 128, 0, 0.35);
        }

        .fight-banner.select-left .side-right {
            filter: brightness(0.55);
        }

        .fight-banner.select-right .side-right {
            filter: brightness(1.18);
            box-shadow: inset 0 0 70px rgba(255, 196, 34, 0.35);
        }

        .fight-banner.select-right .side-left {
            filter: brightness(0.55);
        }

        /* 拳手人物：统一暗色海报风格，不硬抠图 */
        .fighter-figure {
            position: absolute;
            bottom: 0;
            width: 42%;
            height: 78%;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            transition: all 0.45s ease;
            transform-origin: center bottom;
            z-index: 2;
        }

        .fighter-figure img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center bottom;

            /* 统一成黑金暗色体育海报风 */
            filter:
                drop-shadow(0 0 18px rgba(0, 0, 0, 0.85))
                drop-shadow(0 12px 24px rgba(0, 0, 0, 0.95))
                brightness(0.92)
                contrast(1.18)
                saturate(1.35)
                sepia(0.18);

            transition: all 0.45s ease;
        }

        /* 人物底部暗色渐变遮罩，让人物和页面融合 */
        .fighter-figure::before {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 42%;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0.55), transparent);
            z-index: 3;
            pointer-events: none;
        }

        /* 人物底部光晕，代替抠图边缘 */
        .fighter-figure::after {
            content: "";
            position: absolute;
            bottom: -12px;
            left: 50%;
            width: 76%;
            height: 22px;
            background: radial-gradient(circle, rgba(255, 174, 0, 0.35), transparent 70%);
            border-radius: 50%;
            transform: translateX(-50%);
            filter: blur(12px);
            transition: all 0.45s ease;
            z-index: 2;
        }

        .figure-garcia {
            left: 4%;
        }

        .figure-benn {
            right: 4%;
        }

        /* 选中时人物轻微放大 + 金色/橙色外发光 */
        .fight-banner.select-left .figure-garcia {
            transform: scale(1.06);
        }

        .fight-banner.select-left .figure-garcia img {
            filter:
                drop-shadow(0 0 12px rgba(255, 122, 0, 0.85))
                drop-shadow(0 0 22px rgba(255, 122, 0, 0.55))
                drop-shadow(0 12px 24px rgba(0, 0, 0, 0.95))
                brightness(1.05)
                contrast(1.25)
                saturate(1.45)
                sepia(0.22);
        }

        .fight-banner.select-right .figure-benn {
            transform: scale(1.06);
        }

        .fight-banner.select-right .figure-benn img {
            filter:
                drop-shadow(0 0 12px rgba(255, 215, 0, 0.85))
                drop-shadow(0 0 22px rgba(255, 215, 0, 0.55))
                drop-shadow(0 12px 24px rgba(0, 0, 0, 0.95))
                brightness(1.05)
                contrast(1.25)
                saturate(1.45)
                sepia(0.22);
        }

        /* 中间 VS 创新能量环 */
        .vs-center-wrap {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            width: clamp(70px, 14vw, 90px);
            height: clamp(70px, 14vw, 90px);
        }

        .vs-circle {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 0, 0, 0.95), rgba(0, 0, 0, 0.85));
            border: 3px solid transparent;
            border-image: linear-gradient(135deg, #ff7700, #ffd700, #ff7700) 1;
            box-shadow:
                0 0 20px rgba(255, 119, 0, 0.8),
                0 0 40px rgba(255, 119, 0, 0.45);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: clamp(24px, 4.8vw, 30px);
            font-weight: 900;
            color: #fff;
            letter-spacing: 1px;
            position: relative;
        }

        .vs-circle::before,
        .vs-circle::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            border: 2px solid rgba(255, 215, 0, 0.35);
            animation: vsRipple 1.8s infinite ease-out;
        }

        .vs-circle::before {
            width: 160%;
            height: 160%;
            animation-delay: 0s;
        }

        .vs-circle::after {
            width: 210%;
            height: 210%;
            animation-delay: 0.9s;
        }

        @keyframes vsRipple {
            0% {
                transform: scale(0.5);
                opacity: 0.9;
            }
            100% {
                transform: scale(1.6);
                opacity: 0;
            }
        }

        .vs-inner-glow {
            position: absolute;
            width: 62%;
            height: 62%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.25), transparent 70%);
            animation: innerPulse 2.2s infinite ease-in-out;
        }

        @keyframes innerPulse {
            0%, 100% {
                opacity: 0.65;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.15);
            }
        }

        /* 选手名字与描述 */
        .player-name-big {
            font-size: clamp(20px, 4.5vw, 32px);
            font-weight: 900;
            position: relative;
            z-index: 4;
            margin-top: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .left-name {
            color: #ff8c28;
            text-shadow:
                0 0 8px rgba(255, 122, 0, 0.8),
                0 0 16px rgba(255, 122, 0, 0.5);
        }

        .right-name {
            color: #e9c252;
            text-shadow:
                0 0 8px rgba(255, 215, 0, 0.8),
                0 0 16px rgba(255, 215, 0, 0.5);
        }

        .player-sub {
            font-size: 12px;
            opacity: 0.85;
            position: relative;
            z-index: 4;
            margin-top: 4px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.75);
        }

        .predict-label {
            font-size: 15px;
            color: #ffd066;
            font-weight: bold;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        /* 竞猜选项卡片 */
        .option-item {
            border-radius: 16px;
            border: 2px solid transparent;
            background: #181920;
            padding: 16px;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.35s all ease;
            flex-wrap: wrap;
            gap: 12px;
        }

        .option-item:hover {
            background: #1e2029;
        }

        .option-item.active {
            border-color: #ffbc2c;
            background: #232420;
            box-shadow: 0 0 24px rgba(255, 179, 34, 0.25);
            transform: scale(1.02);
        }

        .option-left {
            display: flex;
            gap: 14px;
            align-items: center;
        }

            height: 24px;
            border-radius: 50%;
